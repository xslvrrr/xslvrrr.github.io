name: Web release verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      PORTAL_CREDENTIALS_SECRET: ci-only-portal-secret-at-least-32-characters
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-only-service-role-key-not-valid-for-network-use
      OPENROUTER_API_KEY: ci-only-openrouter-key-not-valid-for-network-use
      CRON_SECRET: ci-only-retention-cron-secret-at-least-32-characters
      GOOGLE_CALENDAR_ENABLED: "false"
      PORTAL_SYNC_ALLOW_BROWSER_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build release bundle
        run: bun run build
