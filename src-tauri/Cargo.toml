[package]
name = "millennium-desktop"
version = "1.0.9"
description = "Millennium Desktop"
authors = ["Millennium"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
percent-encoding = "2.3"
socket2 = "0.6"
tiny_http = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rusqlite = "0.32.1"
sha2 = "0.10"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSButton", "NSResponder", "NSView", "NSWindow"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
